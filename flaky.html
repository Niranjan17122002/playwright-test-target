<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Weekly Report - Test Target App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav>
    <a href="index.html" id="nav-home">Home</a>
    <a href="login.html" id="nav-login">Login</a>
    <a href="dashboard/index.html" id="nav-dashboard">Dashboard</a>
    <a href="team/index.html" id="nav-team">Team</a>
    <a href="contact.html" id="nav-contact">Contact</a>
    <a href="about.html" id="nav-about">About</a>
    <a href="flaky.html" id="nav-report">Report</a>
  </nav>
  <main>
    <h1>Weekly Report</h1>
    <p>Press the button to load this week's report. The report server is sometimes slow.</p>
    <button type="button" id="load-report">Load report</button>
    <div class="message" id="report-status" role="status"></div>
  </main>

  <script>
    // About half of the loads answer at once and half take 7 seconds, so a test that waits the
    // usual 5 seconds passes on some attempts and fails on others (a flaky page, on purpose).
    // ?speed=fast or ?speed=slow forces one of the two, for checking the page by hand.
    document.getElementById('load-report').addEventListener('click', function () {
      var status = document.getElementById('report-status');
      var speed = new URLSearchParams(location.search).get('speed');
      var slow = speed === 'slow' ? true : speed === 'fast' ? false : Math.random() < 0.5;
      status.className = 'message';
      status.textContent = 'Loading report...';
      setTimeout(function () {
        status.textContent = 'Report loaded: 42 rows';
        status.className = 'message success';
      }, slow ? 7000 : 300);
    });
  </script>
</body>
</html>
