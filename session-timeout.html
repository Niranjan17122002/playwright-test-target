<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Session Timeout - Test Target App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav>
    <a href="index.html" id="nav-home">Home</a>
    <a href="login.html" id="nav-login">Login</a>
    <a href="dashboard/index.html" id="nav-dashboard">Dashboard</a>
    <a href="team/index.html" id="nav-team">Team</a>
    <a href="contact.html" id="nav-contact">Contact</a>
    <a href="about.html" id="nav-about">About</a>
  </nav>
  <main>
    <h1>Session Timeout Demo</h1>
    <p>This page simulates an idle session timeout, for testing time-based waits.</p>
    <p>Time remaining: <span id="session-countdown" class="countdown">20</span>s</p>
    <button type="button" id="extend-session-btn">Stay Logged In</button>
    <div class="message" id="session-expired-message"></div>
  </main>

  <script>
    (function () {
      if (localStorage.getItem('ttapp_logged_in') !== '1') {
        window.location.href = 'login.html';
        return;
      }

      var SESSION_SECONDS = 20;
      var remaining = SESSION_SECONDS;
      var countdownEl = document.getElementById('session-countdown');
      var timerId = null;

      function tick() {
        remaining--;
        countdownEl.textContent = String(remaining);
        if (remaining <= 0) {
          clearInterval(timerId);
          localStorage.removeItem('ttapp_logged_in');
          localStorage.removeItem('ttapp_role');
          var expiredMsg = document.getElementById('session-expired-message');
          expiredMsg.textContent = 'Your session has expired. Redirecting to login...';
          expiredMsg.className = 'message error';
          setTimeout(function () {
            window.location.href = 'login.html';
          }, 2000);
        }
      }

      timerId = setInterval(tick, 1000);

      document.getElementById('extend-session-btn').addEventListener('click', function () {
        remaining = SESSION_SECONDS;
        countdownEl.textContent = String(remaining);
      });
    })();
  </script>
</body>
</html>
