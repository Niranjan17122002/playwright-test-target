<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Contact - Test Target App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav>
    <a href="index.html" id="nav-home">Home</a>
    <a href="login.html" id="nav-login">Login</a>
    <a href="contact.html" id="nav-contact">Contact</a>
    <a href="about.html" id="nav-about">About</a>
  </nav>
  <main>
    <h1>Contact Us</h1>
    <form id="contact-form">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required />

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required />

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="4" required></textarea>

      <button type="submit" id="contact-submit">Send</button>
      <div class="message" id="contact-message"></div>
    </form>
  </main>

  <script>
    document.getElementById('contact-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var message = document.getElementById('contact-message');
      message.textContent = 'Thanks! Your message has been sent.';
      message.className = 'message success';
      document.getElementById('contact-form').reset();
    });
  </script>
</body>
</html>
