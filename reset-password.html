<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Reset Password - Test Target App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav>
    <a href="index.html" id="nav-home">Home</a>
    <a href="login.html" id="nav-login">Login</a>
    <a href="dashboard/index.html" id="nav-dashboard">Dashboard</a>
    <a href="team/index.html" id="nav-team">Team</a>
    <a href="contact.html" id="nav-contact">Contact</a>
    <a href="about.html" id="nav-about">About</a>
  </nav>
  <main>
    <h1>Reset Password</h1>
    <div class="message" id="invalid-token-message"></div>
    <form id="reset-form">
      <label for="reset-new-password">New password</label>
      <input type="password" id="reset-new-password" name="new-password" required />

      <label for="reset-confirm-password">Confirm new password</label>
      <input type="password" id="reset-confirm-password" name="confirm-password" required />

      <button type="submit" id="reset-submit">Reset Password</button>
      <div class="message" id="reset-message"></div>
    </form>
  </main>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var token = params.get('token');
      var storedToken = localStorage.getItem('ttapp_reset_token');
      var form = document.getElementById('reset-form');

      if (!token || token !== storedToken) {
        var invalidMsg = document.getElementById('invalid-token-message');
        invalidMsg.innerHTML = 'This reset link is invalid or has expired. <a href="forgot-password.html">Request a new one</a>.';
        invalidMsg.className = 'message error';
        form.style.display = 'none';
        return;
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var password = document.getElementById('reset-new-password').value;
        var confirmPassword = document.getElementById('reset-confirm-password').value;
        var message = document.getElementById('reset-message');

        if (password.length < 8 || !/\d/.test(password)) {
          message.textContent = 'Password must be at least 8 characters and include a number.';
          message.className = 'message error';
          return;
        }
        if (password !== confirmPassword) {
          message.textContent = 'Passwords do not match.';
          message.className = 'message error';
          return;
        }

        localStorage.removeItem('ttapp_reset_token');
        localStorage.removeItem('ttapp_reset_email');
        message.innerHTML = 'Your password has been reset. <a href="login.html">Log in</a>.';
        message.className = 'message success';
        form.reset();
      });
    })();
  </script>
</body>
</html>
