<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Forgot Password - Test Target App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav>
    <a href="index.html" id="nav-home">Home</a>
    <a href="login.html" id="nav-login">Login</a>
    <a href="dashboard/index.html" id="nav-dashboard">Dashboard</a>
    <a href="team/index.html" id="nav-team">Team</a>
    <a href="contact.html" id="nav-contact">Contact</a>
    <a href="about.html" id="nav-about">About</a>
  </nav>
  <main>
    <h1>Forgot Password</h1>
    <form id="forgot-form">
      <label for="forgot-email">Email</label>
      <input type="email" id="forgot-email" name="email" required />
      <button type="submit" id="forgot-submit">Send Reset Link</button>
      <div class="message" id="forgot-message"></div>
    </form>
  </main>

  <script>
    document.getElementById('forgot-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var email = document.getElementById('forgot-email').value.trim();
      var message = document.getElementById('forgot-message');
      if (!email) return;

      var token = Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem('ttapp_reset_token', token);
      localStorage.setItem('ttapp_reset_email', email);

      message.innerHTML = 'If an account exists for that email, a reset link has been sent. ' +
        '(No real email is sent in this demo -- <a href="reset-password.html?token=' + token + '" id="reset-link">use this link to continue</a>.)';
      message.className = 'message success';
    });
  </script>
</body>
</html>
