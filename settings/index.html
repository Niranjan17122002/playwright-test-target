<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Settings - Test Target App</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <main>
    <h1>Settings</h1>
    <form id="settings-form">
      <label for="display-name">Display name</label>
      <input type="text" id="display-name" required />
      <label><input type="checkbox" id="email-alerts" /> Email alerts</label>
      <button type="submit">Save settings</button>
    </form>
    <p id="settings-saved" class="message" role="status" style="display:none;">Settings saved.</p>
  </main>
  <script>
    document.getElementById('settings-form').addEventListener('submit', function (e) {
      e.preventDefault();
      document.getElementById('settings-saved').style.display = 'block';
    });
  </script>
</body>
</html>
