<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Upload - Test Target App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav>
    <a href="index.html" id="nav-home">Home</a>
    <a href="login.html" id="nav-login">Login</a>
    <a href="dashboard/index.html" id="nav-dashboard">Dashboard</a>
    <a href="team/index.html" id="nav-team">Team</a>
    <a href="contact.html" id="nav-contact">Contact</a>
    <a href="about.html" id="nav-about">About</a>
  </nav>
  <main>
    <h1>Upload a File</h1>
    <form id="upload-form">
      <label for="file-input">Choose a file</label>
      <input type="file" id="file-input" name="file" />
      <button type="submit" id="upload-submit">Upload</button>
      <div class="message" id="upload-message"></div>
    </form>
    <ul id="uploaded-files-list" class="list"></ul>
  </main>

  <script>
    document.getElementById('upload-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var input = document.getElementById('file-input');
      var message = document.getElementById('upload-message');

      if (!input.files || input.files.length === 0) {
        message.textContent = 'Please choose a file first.';
        message.className = 'message error';
        return;
      }

      var file = input.files[0];
      message.textContent = 'Uploaded: ' + file.name;
      message.className = 'message success';

      var li = document.createElement('li');
      li.className = 'list-item';
      li.innerHTML = '<span></span><span class="tag"></span>';
      li.children[0].textContent = file.name;
      li.children[1].textContent = Math.max(1, Math.round(file.size / 1024)) + ' KB';
      document.getElementById('uploaded-files-list').appendChild(li);

      input.value = '';
    });
  </script>
</body>
</html>
